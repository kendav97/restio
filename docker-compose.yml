services:
  postgres:
    image: postgres:16-alpine
    container_name: restio-postgres
    environment:
      POSTGRES_DB: restio
      POSTGRES_USER: restio
      POSTGRES_PASSWORD: restio
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - restio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restio -d restio"]
      interval: 5s
      timeout: 5s
      retries: 10

  restio:
    build: .
    container_name: restio-app
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      RESTIO_DB_URL: jdbc:postgresql://postgres:5432/restio
      RESTIO_DB_USER: restio
      RESTIO_DB_PASSWORD: restio
      RESTIO_JWT_SECRET: ${RESTIO_JWT_SECRET:-local-development-secret-at-least-32-bytes}
    ports:
      - "8080:8080"

volumes:
  restio-postgres-data:
