spring:
  application:
    name: restio
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${RESTIO_DB_URL:jdbc:postgresql://localhost:5432/restio}
    username: ${RESTIO_DB_USER:restio}
    password: ${RESTIO_DB_PASSWORD:restio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

restio:
  jwt:
    secret: ${RESTIO_JWT_SECRET:change-me-in-production-at-least-32-bytes-long}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    pin-token-ttl: PT8H
    device-token-ttl: PT1H
  auth:
    max-failed-attempts: 5
    lock-duration: PT15M
    pairing-code-ttl: PT10M

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
      lifecycle-management: start_only

logging:
  level:
    com.restio: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  docker:
    compose:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false

springdoc:
  swagger-ui:
    enabled: false
